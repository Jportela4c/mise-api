
services:
  postgres:
    image: postgres:17
    container_name: mise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mise_db
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: mise_dev_123

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - mise_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise -d mise_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mise_postgres_data:
