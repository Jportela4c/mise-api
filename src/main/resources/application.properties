# Default language for application messages
quarkus.default-locale=en-US

# Supported application languages
quarkus.locales=en-US

# Flyway executa as migrações no início
%dev.quarkus.flyway.migrate-at-start=true

# Hibernate valida a estrutura, mas não modifica tabelas
%dev.quarkus.hibernate-orm.schema-management.strategy=validate

# PostgreSQL da Mise
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=mise
%dev.quarkus.datasource.password=mise_dev_123
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/mise_db

# Desativar Dev Services no desenvolvimento
%dev.quarkus.datasource.devservices.enabled=false